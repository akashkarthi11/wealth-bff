spring:
  application:
    name: wealth-bff

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

wealth:
  bss:
    base-url: ${WEALTH_BSS_BASE_URL:http://localhost:8081}

---
spring:
  config:
    activate:
      on-profile: dev
wealth:
  environment: development

---
spring:
  config:
    activate:
      on-profile: prod
wealth:
  environment: production
